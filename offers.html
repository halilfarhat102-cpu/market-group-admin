<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>العروض الحصرية | متجر مسعودي</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Alexandria:wght@100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar scrolled" id="navbar">
        <div class="container">
            <div class="logo" onclick="location.href='index.html'">
                <img src="./logo.png" alt="مسعودي" style="height: 50px; vertical-align: middle;">
            </div>
            <ul class="nav-links">
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="index.html#products">المنتجات</a></li>
                <li><a href="offers.html">العروض</a></li>
                <li><a href="contact.html">تواصل معنا</a></li>
            </ul>
            <div class="nav-icons">
                <button class="nav-icon" id="themeToggle"><i data-lucide="moon"></i></button>
                <button class="nav-icon" onclick="location.href='index.html#cart'">
                    <i data-lucide="shopping-cart"></i>
                </button>
                <button class="nav-icon" id="userBtn">
                    <i data-lucide="user"></i>
                    <div id="userProfile" style="display: none; align-items: center; gap: 8px;">
                        <img id="userImg" src="" alt="Profile" style="width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--primary);">
                    </div>
                </button>
            </div>
        </div>
    </nav>

    <!-- Offers Section -->
    <section style="padding: 150px 0 100px;">
        <div class="container">
            <div class="section-header">
                <h2>أقوى عروض الموسم 🔥</h2>
                <div class="divider"></div>
            </div>
            <div class="products-grid" id="offersGrid">
                <!-- Offers will be rendered here via script -->
            </div>
        </div>
    </section>



    <!-- Login Modal (Small & Elegant) -->
    <div class="modal-overlay" id="loginModal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 9999; align-items: center; justify-content: center; padding: 15px;">
        <div class="modal-content" style="background: white; width: 100%; max-width: 320px; border-radius: 28px; padding: 30px 24px; text-align: center; position: relative; box-shadow: 0 20px 40px rgba(0,0,0,0.15); border: 1px solid rgba(241,245,249,1); animation: slideUp 0.3s ease-out;">
            <button class="modal-close-btn" onclick="closeLogin()" style="position: absolute; top: 15px; left: 15px; background: transparent; border: none; width: 30px; height: 30px; border-radius: 10px; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; transition: all 0.2s;">
                <i data-lucide="x" style="width: 18px;"></i>
            </button>
            
            <div style="width: 50px; height: 50px; background: rgba(255,107,0,0.08); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: var(--primary);">
                <i data-lucide="log-in" style="width: 24px;"></i>
            </div>
            
            <h2 style="font-size: 1.25rem; font-weight: 900; color: #0f172a; margin-bottom: 8px;">تسجيل الدخول</h2>
            <p style="font-size: 0.8rem; color: #64748b; margin-bottom: 25px; line-height: 1.4; font-weight: 600;">تابع باستخدام حساب جوجل للمتابعة</p>
            
            <div id="googleBtnContainer" style="display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%;">
                <!-- Main GSI Rendering Target -->
                <div id="g_id_signin" style="width: 100%; display: flex; justify-content: center;"></div>
                
                <!-- Fallback button -->
                <button id="gsiFallbackBtn" onclick="firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())" style="display: flex; width: 100%; padding: 10px; border-radius: 12px; border: 1.5px solid #e2e8f0; background: white; color: #475569; font-weight: 800; font-size: 0.85rem; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: background 0.2s;">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16">
                    <span>الدخول عبر جوجل</span>
                </button>
                
                <p style="font-size: 0.65rem; color: #cbd5e1; font-weight: 600; margin-top: 10px;">بالمتابعة أنت توافق على شروط الخدمة</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Custom logic for offers page
        async function fetchOffers() {
            const snapshot = await db.collection('products').where('discount', '>', 0).get();
            const offers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            const grid = document.getElementById('offersGrid');
            grid.innerHTML = '';
            offers.forEach(p => {
                const finalPrice = p.price * (1 - p.discount/100);
                const card = document.createElement('div');
                card.className = 'product-card fade-in';
                card.innerHTML = `
                    <div class="image-wrapper">
                        <img src="${p.image}" alt="${p.name}" loading="lazy">
                        <div style="position: absolute; top: 10px; left: 10px; background: #EF4444; color: white; padding: 5px 12px; border-radius: 50px; font-weight: 800; font-size: 0.8rem;">-${p.discount}%</div>
                    </div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="price-tag">${new Intl.NumberFormat('ar-EG').format(finalPrice)} ج.م</div>
                        <div style="text-decoration: line-through; color: var(--text-muted); font-size: 0.9rem;">${new Intl.NumberFormat('ar-EG').format(p.price)} ج.م</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }
        document.addEventListener('DOMContentLoaded', fetchOffers);
        lucide.createIcons();
    </script>
</body>
</html>
